# Eraasim Admin only. Certbot owns the referenced certificate files; this repository does not.
server {
    listen 80;
    listen [::]:80;
    server_name admin.eraasim.signalgrowth.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.eraasim.signalgrowth.in;

    client_max_body_size 6M;

    ssl_certificate /etc/letsencrypt/live/admin.eraasim.signalgrowth.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.eraasim.signalgrowth.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:5201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
